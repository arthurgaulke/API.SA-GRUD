<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Classificação D&D</title>
    <link rel="stylesheet" href="style.css">
    <script src="API.js" defer></script>
</head>

<body>
    <h1>Classificação D&D</h1>
    <div class="form">
        <input id="nome" placeholder="Nome">
        <select id="classe">
            <option>Guerreiro</option>
            <option>Mago</option>
            <option>Algoz</option>
            <option>Atirador</option>
            <option>Clérigo</option>
        </select>
        <input id="nivel" type="number" min="1" value="1">
        <button id="btnSalvar" type="button">Salvar</button>
    </div>
    <ul id="lista"></ul>
</body>
</html>
